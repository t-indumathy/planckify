name: E2E Test — Gemma 4 E2B CPU

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-cpu-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: experiments/gemma4_e2b_cpu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify litert_lm import and CPU backend
        run: |
          python -c "
          import litert_lm
          assert hasattr(litert_lm, 'Engine'), 'Engine missing'
          assert hasattr(litert_lm.Backend, 'CPU'), 'CPU backend missing'
          assert hasattr(litert_lm, 'LogSeverity'), 'LogSeverity missing'
          print('litert_lm import OK — Engine, Backend.CPU, LogSeverity all present')
          "

      - name: Download Gemma 4 E2B model from HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python download_model.py

      - name: Run CPU inference smoke test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python run_inference_cpu.py \
            --prompt "Explain what LiteRT-LM is in one sentence." \
            --max_tokens 64

      - name: Run benchmark (3 prompts)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python benchmark.py --runs 3

      - name: Lint with ruff
        continue-on-error: true
        run: |
          pip install ruff
          ruff check .
