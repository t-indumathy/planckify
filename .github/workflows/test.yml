name: Smoke Test — Gemma 4 E2B CPU

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/gemma4_e2b_cpu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify litert_lm import and CPU backend
        run: |
          python -c "
          import litert_lm
          print('litert_lm imported successfully')
          print('Backend.CPU available:', hasattr(litert_lm.Backend, 'CPU'))
          print('Engine class present:', hasattr(litert_lm, 'Engine'))
          print('LogSeverity present:', hasattr(litert_lm, 'LogSeverity'))
          assert hasattr(litert_lm.Backend, 'CPU'), 'CPU backend missing'
          assert hasattr(litert_lm, 'Engine'), 'Engine class missing'
          print('All checks passed.')
          "

      - name: Lint with ruff
        continue-on-error: true
        run: |
          pip install ruff
          ruff check .
