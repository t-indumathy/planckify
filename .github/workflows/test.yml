name: planckify CI — LiteRT-LM + ONNX Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------ #
  # Job 1: LiteRT-LM — Gemma 4 E2B CPU                                  #
  # Full end-to-end: download model + run inference + benchmark          #
  # ------------------------------------------------------------------ #
  litert-lm-cpu:
    name: LiteRT-LM — Gemma 4 E2B CPU
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    defaults:
      run:
        working-directory: experiments/gemma4_e2b_cpu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiments/gemma4_e2b_cpu/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Gemma 4 E2B model
        run: python download_model.py

      - name: Run CPU inference smoke test
        run: |
          python run_inference_cpu.py \
            --prompt "What is the Planck constant?" \
            --max-tokens 32

      - name: Run benchmark (5 prompts)
        run: python benchmark.py --max-tokens 32

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .

  # ------------------------------------------------------------------ #
  # Job 2: ONNX Runtime (raw) — Gemma 4 E2B CPU                         #
  # Smoke test: verify imports + deps without model download             #
  # Full E2E gated on HF_TOKEN env var being set                         #
  # ------------------------------------------------------------------ #
  onnx-runtime-cpu:
    name: ONNX Runtime (raw) — Gemma 4 E2B CPU
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    defaults:
      run:
        working-directory: experiments/gemma4_e2b_onnx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiments/gemma4_e2b_onnx/requirements.txt

      - name: Install dependencies (no torch/torchvision)
        run: pip install -r requirements.txt

      - name: Run import smoke test (no model needed)
        run: python test_import.py

      - name: Download ONNX model (requires HF_TOKEN)
        if: ${{ env.HF_TOKEN != '' }}
        run: python download_model.py

      - name: Run CPU inference smoke test
        if: ${{ env.HF_TOKEN != '' }}
        run: |
          python run_inference_cpu.py \
            --prompt "What is the Planck constant?" \
            --max-tokens 32

      - name: Run benchmark (5 prompts)
        if: ${{ env.HF_TOKEN != '' }}
        run: python benchmark.py --max-tokens 32

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .
